<!doctype html>
<html class="wa-theme-lgs1920 wa-brand-yellow wa-dark" data-fa-kit-code="eb5c406148" lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
          name="viewport">

    <!-- Theme color for Android and browsers -->
    <meta content="#000000" name="theme-color"/>

    <!-- PWA Manifest -->
    <link href="/manifest.webmanifest" rel="manifest" type="application/manifest+json">

    <!-- iOS PWA -->

    <meta content="yes" name="mobile-web-app-capable">
    <meta content="black" name="apple-mobile-web-app-status-bar-style">
    <meta content="LGS Studio" name="apple-mobile-web-app-title">
    <link href="/assets/icons/app-icons/ios/180.png" rel="apple-touch-icon" sizes="180x180">
    <link href="/assets/icons/app-icons/ios/167.png" rel="apple-touch-icon" sizes="167x167">
    <link href="/assets/icons/app-icons/ios/152.png" rel="apple-touch-icon" sizes="152x152">
    <link href="/assets/icons/app-icons/ios/120.png" rel="apple-touch-icon" sizes="120x120">


    <!-- Android and browser icons -->
    <!-- Windows PWA -->
    <meta content="/assets/icons/app-icons/windows11/Square150x150Logo.scale-400.png" name="msapplication-TileImage">
    <meta content="#000000" name="msapplication-TileColor">
    <script>
        (function () {
            window.performance?.mark?.('lgs.startup.static-shell')
            const root = document.documentElement
            const storedTheme = localStorage.getItem('theme') || 'system'
            const storedBrandColor = localStorage.getItem('brandColor') || 'yellow'
            const allowedBrandColors = new Set(['yellow', 'orange', 'red', 'pink', 'purple', 'blue', 'green', 'gray'])
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)')
            const isDark = storedTheme === 'dark' || (storedTheme === 'system' && mediaQuery.matches)
            const brandColor = allowedBrandColors.has(storedBrandColor) ? storedBrandColor : 'yellow'
            const prefixesToReset = ['sl-theme-', 'wa-brand-', 'wa-palette-', 'wa-neutral-', 'wa-success-', 'wa-warning-', 'wa-danger-']
            const classesToRemove = Array.from(root.classList).filter((className) => {
                if (className === 'wa-theme-premium') {
                    return true
                }

                if (className.startsWith('wa-theme-') && className !== 'wa-theme-lgs1920') {
                    return true
                }

                return prefixesToReset.some(prefix => className.startsWith(prefix))
            })

            if (classesToRemove.length > 0) {
                root.classList.remove(...classesToRemove)
            }

            root.classList.add('wa-theme-lgs1920', `wa-brand-${brandColor}`)
            root.classList.toggle('wa-dark', isDark)
            root.classList.toggle('wa-light', !isDark)
        })()
    </script>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #050807;
        }

        #cesium-viewer,
        #lgs1920-container {
            position: absolute;
            inset: 0;
        }

        #lgs-startup-background img,
        #lgs-boot-splash .lgs-boot-splash-background {
            position: absolute;
            width: 100%;
            height: 100%;
            filter: sepia(0.2) saturate(0.8);
            object-fit: cover;
            object-position: center bottom;
            pointer-events: none;
        }

        #lgs-startup-background {
            position: fixed;
            z-index: 2;
            overflow: hidden;
            transition: opacity 350ms ease, visibility 350ms ease;
            inset: 0;
        }

        body:not(.lgs-app-booting) #lgs-startup-background {
            visibility: hidden;
            opacity: 0;
        }

        #lgs-startup-background::after {
            position: absolute;
            z-index: 1;
            content: "";
            background:
                linear-gradient(90deg, rgba(0, 0, 0, 0.48), rgba(0, 0, 0, 0.24) 46%, rgba(0, 0, 0, 0.04) 100%),
                linear-gradient(180deg, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.14) 48%, rgba(0, 0, 0, 0.54));
            pointer-events: none;
            inset: 0;
        }

        #lgs-boot-splash {
            position: fixed;
            z-index: calc(var(--lgs-toast-zindex, 2147483647) - 3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 450ms ease, visibility 450ms ease;
            pointer-events: none;
            background: #050807;
            inset: 0;
            visibility: hidden;
            opacity: 0;
        }

        body.lgs-app-booting #lgs-boot-splash {
            visibility: visible;
            opacity: 1;
        }

        #lgs-boot-splash .lgs-boot-splash-background {
            position: absolute;
            width: 100%;
            height: 100%;
            transition: opacity 250ms ease;
        }

        #lgs-boot-splash .lgs-boot-splash-background-image {
            z-index: 0;
            opacity: 1;
        }

        #lgs-boot-splash video {
            z-index: 1;
            opacity: 0;
        }

        #lgs-boot-splash.lgs-boot-splash-video-ready video {
            opacity: 1;
        }

        #lgs-boot-splash.lgs-boot-splash-video-ready .lgs-boot-splash-background-image {
            opacity: 0;
        }

        #lgs-boot-splash::after {
            position: absolute;
            z-index: 2;
            content: "";
            background:
                linear-gradient(90deg, rgba(0, 0, 0, 0.48), rgba(0, 0, 0, 0.24) 46%, rgba(0, 0, 0, 0.04) 100%),
                linear-gradient(180deg, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.14) 48%, rgba(0, 0, 0, 0.54));
            opacity: 1;
            pointer-events: none;
            transition: opacity 1200ms ease;
            inset: 0;
        }

        #lgs-boot-splash.lgs-boot-splash-cta-ready::after {
            opacity: 0.3;
        }

        #lgs-boot-splash-logo {
            position: absolute;
            z-index: 3;
            top: 42%;
            left: 50%;
            width: min(220px, calc(100vw - 2rem));
            height: auto;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 18px rgba(0, 0, 0, 0.55));
        }

        #lgs-boot-splash-slogan {
            position: absolute;
            z-index: 3;
            top: calc(42% + 4.3rem);
            left: 50%;
            width: min(28rem, calc(100vw - 2rem));
            height: auto;
            transform: translateX(-50%);
            color: #f0c800;
            filter: drop-shadow(0 0 14px rgba(0, 0, 0, 0.72));
        }

        #lgs-boot-splash .welcome-branding-cog {
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1.3rem;
            height: 1.3rem;
            margin-top: calc(42vh + 3.35rem);
            color: var(--wa-color-brand);
        }

        #lgs-boot-splash .welcome-branding-cog > wa-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.3rem;
            height: 1.3rem;
            min-width: 1.3rem;
            min-height: 1.3rem;
            font-size: 1.3rem;
            line-height: 1;
            transform-origin: center center;
            filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.72));
            /* Sets the Web Awesome cog rotation duration. */
            --animation-duration: 3s;
        }

        #lgs-boot-splash.lgs-boot-splash-react-ready .welcome-branding-cog,
        #lgs-boot-splash.lgs-boot-splash-cta-ready .welcome-branding-cog {
            visibility: hidden;
            opacity: 0;
        }

        #lgs-boot-splash.lgs-boot-splash-react-ready #lgs-boot-splash-logo,
        #lgs-boot-splash.lgs-boot-splash-react-ready #lgs-boot-splash-slogan {
            opacity: 0;
            visibility: hidden;
        }

        /* Keep the welcome route visible before the React application styles load. */
        #lgs-boot-splash::after {
            z-index: 1;
        }

        #lgs-boot-splash > [data-lgs-boot-route-host] {
            position: absolute;
            z-index: 2;
            --hero-route-path-color: rgb(125, 220, 24);
            --hero-route-glow-color: var(--wa-color-brand);
            --hero-route-poi-color: rgb(190, 255, 72);
            isolation: isolate;
            pointer-events: none;
            inset: 0;
        }

        #lgs-boot-splash > [data-lgs-boot-route-host] .welcome-hero-route {
            position: absolute;
            z-index: 2;
            pointer-events: none;
            inset: 0;
        }

        #lgs-boot-splash > [data-lgs-boot-route-host] .welcome-hero-route-canvas {
            display: block;
            width: 100%;
            height: 100%;
            opacity: .86;
            filter: drop-shadow(0 0 8px color-mix(in oklab, var(--hero-route-glow-color) 42%, transparent));
            mix-blend-mode: screen;
        }

        #lgs-boot-splash > [data-lgs-boot-route-host] .welcome-hero-route-annotations {
            position: absolute;
            z-index: 4;
            pointer-events: none;
            inset: 0;
        }

        #lgs-boot-splash > [data-lgs-boot-route-host] .welcome-hero-poi {
            position: absolute;
            top: 0;
            left: 0;
            visibility: hidden;
            opacity: 0;
            color: var(--hero-route-poi-color);
            transform: translate3d(var(--welcome-hero-poi-x, 50%), var(--welcome-hero-poi-y, 50%), 0) translate3d(-50%, -100%, 0) scale(var(--welcome-hero-poi-scale, 1));
            transition: opacity 450ms ease, transform 34ms linear, visibility 450ms ease;
            will-change: transform;
        }

        #lgs-boot-splash > [data-lgs-boot-route-host] .welcome-hero-poi.is-revealed.is-positioned,
        #lgs-boot-splash > [data-lgs-boot-route-host] .welcome-hero-route[data-render-mode='fallback'] .welcome-hero-poi {
            visibility: visible;
            opacity: 1;
        }

        #lgs-boot-splash > [data-lgs-boot-route-host] .welcome-hero-poi-marker {
            display: block;
            width: clamp(1.5rem, 3.5vw, 2.25rem);
            height: clamp(1.5rem, 3.5vw, 2.25rem);
            color: var(--hero-route-poi-color);
            filter: drop-shadow(0 0 .2rem rgba(190, 255, 72, .82)) drop-shadow(0 0 .52rem rgba(190, 255, 72, .74));
            transform-origin: center bottom;
        }

        @media (max-width: 700px) {
            #lgs-boot-splash-logo {
                width: min(150px, calc(100vw - 2rem));
            }

            #lgs-boot-splash-slogan {
                top: calc(42% + 3.4rem);
            }
        }

        body.lgs-app-booting #cesium-viewer {
            visibility: hidden;
            pointer-events: none;
            opacity: 0;
        }

        body:not(.lgs-app-booting) #lgs-boot-splash {
            visibility: hidden;
            opacity: 0;
        }
    </style>

    <!-- Favicon for browsers -->
    <link href="/assets/icons/app-icons/windows11/Square44x44Logo.targetsize-16.png" rel="icon" sizes="16x16" type="image/png">
    <link href="/assets/icons/app-icons/windows11/Square44x44Logo.targetsize-32.png" rel="icon" sizes="32x32" type="image/png">
    <link href="/assets/icons/app-icons/android/android-launchericon-192-192.png" rel="icon" sizes="192x192" type="image/png">
    <link href="/assets/icons/app-icons/android/android-launchericon-512-512.png" rel="icon" sizes="512x512" type="image/png">
    <link href="/assets/images/favicon.png" rel="icon" sizes="200x200" type="image/png"/>

    <!-- Page title -->
    <title>LGS1920 Studio</title>
</head>
<body class="lgs-app-booting">

</div>
<div id="cesium-viewer"></div>

                font-family="Cookie, cursive"
                font-size="64">
                Replay Your World Outdoors.
            </text>
        </g>
    </svg>
</div>
<div id="lgs1920-container"></div>

<script src="/src/assets/media/welcome-startup-background.js" type="module"></script>
<script src="/src/main.jsx" type="module"></script>
