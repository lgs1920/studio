################################################################################
# LGS1920 Application settings
#
# These parameters can be updated by the user while the application is running.
#
# Note that this is not currently the case, as many of them cannot be modified
# using a user interface! Let's do it!
################################################################################

########################################
# File version
########################################
version: 1.0

########################################
# Cesium Ion
# Shared token: please do not use it outside LGS1920 app
########################################

ion:
  sharedToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI4ZmZkZjZkYS1iODgwLTQzYzUtOTM5ZS1iYTc2Nzk0OTM1ZjQiLCJpZCI6MTkwODA4LCJpYXQiOjE3MDU2ODQ3OTZ9.BV6yuYzhp8A_cgEs5MbqZWZaCtyOW-08aSORPflJ3dw
  promptDelaySeconds: 480
  promptWarningPercent: 80

########################################
# Application settings
########################################
app:
  lastVisit: null         # Last visit date
  firstVisit: true        # Is it the first visit ?
  changelogToRead: true   # Used to check if there are news to read

########################################
# Theme
########################################
theme: 'dark'

########################################
# Scene
########################################
scene:
  morphDelay: 0 #seconds - does not work with other values in 2D->3D
  mode:
    value: 3
    available:
      - 2     # 2D
      - 3     # 3D

########################################
# Initial Starter Point
########################################
starter:
  ## Starter Camera Target
  longitude: 5.70291
  latitude: 45.33524
  height: 1920
  simulatedHeight: 1924 # pseudo height for cesium
  title: La Grande Sure
  location: La Sure en Chartreuse
  country: France
  countryCode: FR
  countries:
    - France
  countryCodes:
    - FR
  bgColor: "#7FFF00"  # chartreuse (127,255,0)
  color: "#ffffff"
  description: At 12 years old, the first time I reached the summit, it was my Everest!
    I return there 2-3 times a year.
  ## Camera position
  camera:
    heading: 0
    pitch: -25
    roll: 0
    range: 5000
    #    longitude: 5.6533
    #    latitude: 45.34623
    #    height: 4300
    canRotate: true
    rpm: 4  # rotation per minute

########################################
# Initial Camera Settings
########################################
camera:
  heading: 0.0
  pitch: -30
  roll: 0.0
  range: 2000
  fps: 30
  orbitalPercentageChanged: 0.05
  percentageChanged: 0.05
  maximumHeight: 9000
  pitchAdjustHeight: 5000
  flyingTime: 3   # seconds
  rpm: 4          # rotation per minute
  rotations: 1    # total rotation

########################################
# Color palette
########################################
swatches:
  list:
    - '#ee6666'
    - '#fac858'
    - '#5470c6'
    - '#91cc75'
    - '#73c0de'
    - '#fc8452'
    - '#9a60b4'
    - '#ea7ccc'
    - '#ff2525'
    - '#ffdd10'
    - '#0044f0'
    - '#7fff00'
    - '#000000'
    - '#ffffff'
    # 2 others are theme dependant

  distribution: 'sequence'
  current: 0

########################################
# Tracks and POIs
########################################
journey:
  thickness: 2            # Initial track thickness (pixels)
  hideOtherJourneys: false # Keep only the current journey visible in scenes
  renderSmoothing:
    enabled: false        # Smooth track rendering without modifying source coordinates
    step: 1               # Chaikin smoothing passes
  activity:
    default: trek
    # Speeds are expressed in meters per second.
    # Used to ignore impossible metric segments without modifying source coordinates.
    types:
      - id: trek
        label: Trek
        icon: person-hiking
        minSegmentDuration: 2
        minSegmentDistance: 3
        maxAltitudeJump: 10
        altitudeSmoothingWindow: 3
        maxSpeed: 3.0          # 10.8 km/h
        maxClimbRate: 1.5      # m/s
        maxDescentRate: 2.5    # m/s
        maxPace: 0
        maxSpeedDelta: 0
        stopDuration: 60
        stopSpeedLimit: 0.2
      - id: trail
        label: Trail
        icon: person-running
        minSegmentDuration: 2
        minSegmentDistance: 3
        maxAltitudeJump: 10
        altitudeSmoothingWindow: 3
        maxSpeed: 5.5          # 19.8 km/h
        maxClimbRate: 2.0
        maxDescentRate: 3.0
        maxPace: 0
        maxSpeedDelta: 0
        stopDuration: 45
        stopSpeedLimit: 0.3
      - id: bike
        label: Bike
        icon: bicycle
        minSegmentDuration: 2
        minSegmentDistance: 5
        maxAltitudeJump: 20
        altitudeSmoothingWindow: 3
        maxSpeed: 16.0         # 57.6 km/h
        maxClimbRate: 2.5
        maxDescentRate: 4.0
        maxPace: 0
        maxSpeedDelta: 0
        stopDuration: 45
        stopSpeedLimit: 0.6
      - id: ski-touring
        label: Ski touring
        icon: person-skiing-nordic
        minSegmentDuration: 2
        minSegmentDistance: 4
        maxAltitudeJump: 15
        altitudeSmoothingWindow: 3
        maxSpeed: 8.0          # 28.8 km/h
        maxClimbRate: 1.6
        maxDescentRate: 6.0
        maxPace: 0
        maxSpeedDelta: 0
        stopDuration: 60
        stopSpeedLimit: 0.25
  ## POIs
  pois:

    ## FlythroughRunner mode
    flythroughRunner:
      color: '#1689CCff'
      border: '#FFF'
    ## Start POI colors
    start:
      color: '#DC143C'
      bgColor: '#f2c55c'
    ## Stop POI colors
    stop:
      color: '#228B22'
      bgColor: '#f2c55c'

########################################
# Global pois
########################################
poi:
  association:
    maxDistance: 10000 # meters - POI can be associated with a journey when one track point is within this distance

  filter:
    byName: ""
    alphabetic: true
    byCategories: false               # in fact, empty array but need false instead
    exclude: false
    open: false
    active: false
    global: true
    journey: false

  categories:
    # POI
    - title: POI
      slug: poi
    # Shelter
    - title: Shelter
      slug: shelter
    # Shelter
    - title: Refuge
      slug: refuge
    # Building
    - title: Building
      slug: building
    # Viewpoint
    - title: Viewpoint
      slug: viewpoint
    # Summit
    - title: Summit
      slug: summit
    # Cave
    - title: Cave
      slug: cave
    # Car Park
    - title: Car Park
      slug: car-park
    # Castle
    - title: Castle
      slug: castle
    # Place of Worship
    - title: Place of Worship
      slug: place-of-worship
    # Cross
    - title: Cross
      slug: cross
      icon: faCross
    # Monument
    - title: Monument
      slug: monument
    # Ruins
    - title: Ruins
      slug: ruins
    # Campground
    - title: Campground
      slug: campground
    # Picnic Area
    - title: Picnic Area
      slug: picnic-area

########################################
# Metrics and computations
########################################
metrics:
  # To check if it is flat (< minSlope)
  minSlope: 2
  # To check movements
  # > stopDuration && > Stop Speed Limit
  stopDuration: 60
  stopSpeedLimit: 0.2

########################################
# Unit system
########################################
unitSystem:
  international: 0  # Metrics
  imperial: 1       # UK,US
  current: 0

coordinateSystem:
  dd: dd             # Decimal degres
  dms: dms           # Degres Minutes Seconds
  current: dd        #
########################################
# UI : general
########################################
ui:

  ## Camera
  camera:
    showPosition: false         # Display Camera position
    showTargetPosition: true    # Display Camera View point
    showHPR: false              # Display Camera HPR
    showMovementWidget: true    # Display Camera movement widget

    targetIcon: # Camera Target Icon
      show: true
      color: white
      background: transparent
      size: 3rem

    start:
      # Initial Focus
      app: starter          # starter : focus on starter POI
      # last : focus on last camera position

      journey: center       # center: focus on journey centroid
      # last : focus on last camera position
      #        for the journey
      # Rotation after focus
      rotate:
        app: true           # Rotate after entrance focus
        journey: true       # Rotate after journey focus

  ## Welcome Modal
  welcome:
    showIntro: true
    autoClose: true
    displayTime: 6   #seconds

  ## Menus
  menu:
    toolBar:
      fromStart: true
    drawers:
      fromStart: false
      fromBottom: true

  ## POI
  poi:
    minScaleFlag: 0.7                   # minimum POI size before replacing by flag (70% of max)
    minScale: 0.3                       # minScale before masking (30% of max)
    distanceThreshold: 10000             # min distance to see POI with 100% size
    focusOnEdit: true                   # Apply focus when editing a POI
    rotate: true                        # Rotation after POI focus
    rpm: 4

  ## Geocoder
  geocoder:
    url: https://nominatim.openstreetmap.org
    proxy: /proxy.php?csurl=
    search: search
    reverse: reverse
    limit: 7 # results per query
    email: contact@lgs1920.fr
    minQuery: 3 # characters

  ## Toolbars
  toolbars:
    defaultOpacity: 0.9
    opacity: 0.9   # 0.3 - 1

  ## Profile
  profile:
    liveData: false

  ## JourneyToolbar
  journeyToolbar:
    usage: true           # Can we use it
    show: true            # Toggle visibility

    top: '50%'
    left: '50%'

  ## Compass
  compass:
    mode: 1                # 0: none, 1: full, 2: light, 3: wind rose

  ## Video
  video:
    format: mp4        # for Video
    image: png         # for Image
    maxDuration: 5     # minutes
    maxSize: 200       # MB
    fps: 1             # 0:30, 1:45, 2:60 => VideoRecorder.FPS
    quality: 1         # 0: medium, 1: high, 2: Ultra high => VideoRecorder.QUALITY
    ratio: null        # 16x9,9x16 ...

  ## PWA
  pwa:
    canInstall: true

  ## Journey Settings
  activities:
    default: trek
    list:
      - id: trek
        label: Trek
        icon: person-hiking
        minSegmentDuration: 2
        minSegmentDistance: 3
        maxAltitudeJump: 10
        altitudeSmoothingWindow: 3
        maxSpeed: 3.0
        maxClimbRate: 1.5
        maxDescentRate: 2.5
        maxPace: 0
        maxSpeedDelta: 0
        stopDuration: 60
        stopSpeedLimit: 0.2
      - id: trail
        label: Trail
        icon: person-running
        minSegmentDuration: 2
        minSegmentDistance: 3
        maxAltitudeJump: 10
        altitudeSmoothingWindow: 3
        maxSpeed: 5.5
        maxClimbRate: 2.0
        maxDescentRate: 3.0
        maxPace: 0
        maxSpeedDelta: 0
        stopDuration: 45
        stopSpeedLimit: 0.3
      - id: bike
        label: Bike
        icon: bicycle
        minSegmentDuration: 2
        minSegmentDistance: 5
        maxAltitudeJump: 20
        altitudeSmoothingWindow: 3
        maxSpeed: 16.0
        maxClimbRate: 2.5
        maxDescentRate: 4.0
        maxPace: 0
        maxSpeedDelta: 0
        stopDuration: 45
        stopSpeedLimit: 0.6
      - id: ski-touring
        label: Ski touring
        icon: person-skiing-nordic
        minSegmentDuration: 2
        minSegmentDistance: 4
        maxAltitudeJump: 15
        altitudeSmoothingWindow: 3
        maxSpeed: 8.0
        maxClimbRate: 1.6
        maxDescentRate: 6.0
        maxPace: 0
        maxSpeedDelta: 0
        stopDuration: 60
        stopSpeedLimit: 0.25
