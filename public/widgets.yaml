# Groups and widgets

# Icons should be defined twice, here and in constants.js
widget-groups:
  multi-purpose-widgets:
    id: "multi-purpose-widgets"
    name: "Multi-purpose Widgets"
    description: "A collection of widgets"
    icon: "puzzle-piece"

  journey-widgets:
    id: "journey-widgets"
    name: "Journey Widgets"
    description: "Widgets related to journeys"
    icon: "route"

  scene-widgets:
    id: "scene-widgets"
    name: "Scene Widgets"
    description: "Widgets available on the scene"
    icon: "image-landscape"

widgets:
  compass-widget:
    id: "compass-widget"
    name: "Compass Widget"
    description: "A compass widget"
    icon: "compass"
    mandatory: false
    max: 1
    component: "CompassWidget"
    groups:
      - "multi-purpose-widgets"

  credits-widget:
    id: "credits-widget"
    name: "Credits Widget"
    description: "A credits widget"
    icon: "user"
    mandatory: true
    component: "CreditsWidget"
    groups:
      - "multi-purpose-widgets"

  profile-widget:
    id: "profile-widget"
    name: "Profile Widget"
    description: "The journey profile widget"
    icon: "chart-fft"
    mandatory: false
    max: 1
    component: "ProfileWidget"
    path: "@Components/Profile"
    groups:
      - "journey-widgets"
      - "scene-widgets"

    ## Configuration
    configuration:
      default:
        show: true
        background:
          show: true
          color: #ffffff"
          opacity: 0.5
          blur: false

        ## Line chart
        line:
          width: 2   # pixels
        ## Marker
        marker:
          ## On track
          track:
            show: true
            size: 13          # Pixels
            color: '#f2c55c'
            border:
              color: '#fff'
              width: 2        # Pixels
          ## On chart
          chart:
            size: 8           # Pixels
            color: '#f2c55c'
            border:
              color: '#fff'
              width: 2        # Pixel
        minInterval: 150      #  TODO
      user:
      elements:
