# Groups and widgets

# Icons should be defined twice, here and in constants.js
widget-groups:
  multi-purpose-widgets:
    id: "multi-purpose-widgets"
    name: "Multi-purpose Widgets"
    description: "A collection of widgets"
    icon: "puzzle-piece"

  journey-widgets:
    id: "journey-widgets"
    name: "Journey Widgets"
    description: "Widgets related to journeys"
    icon: "route"

  scene-widgets:
    id: "scene-widgets"
    name: "Scene Widgets"
    description: "Widgets available on the scene"
    icon: "image-landscape"

widgets:
  compass-widget:
    id: "compass-widget"
    name: "Compass"
    description: "A compass widget"
    icon: "compass"
    mandatory: false
    max: 1
    component: "CompassWidget"
    groups:
      - "multi-purpose-widgets"

  credits-widget:
    id: "credits-widget"
    name: "Credits"
    description: "A credits widget"
    icon: "user"
    mandatory: true
    component: "CreditsWidget"
    groups:
      - "multi-purpose-widgets"

  profile-widget:
    id: "profile-widget"
    name: "Profile"
    description: "The journey profile widget"
    icon: "chart-fft"
    mandatory: false
    max: 1
    component: "ProfileWidget"
    path: "@Components/Profile"
    groups:
      - "journey-widgets"
      - "scene-widgets"

    ## Configuration
    configuration:
      default:
        show: true

        background:
          show: true
          color: "#ffffff"
          opacity: 0.15
          blur: true
          shadow:
            show: true
            value: normal
            color: "#000000"
            opacity: 0.5

        border:
          show: true
          color: "#ffffff"
          opacity: 0.5
          thickness: 1

        xAxis:
          main: true
          second: true
          labels: true
          units: true

        yAxis:
          main: true
          second: true
          labels: true
          units: true

        mainAxis:
          color: "--lgs-dark-color" #CSS variable
          opacity: 0.8
          thickness: 1

        secondAxis:
          color: "--lgs-light-color" #CSS variable
          opacity: 0.6
          thickness: 0.5

        shadow:
          show: true
          value: 'normal'
          color: "#000000"
          opacity: 0.5

      user:
      elements:

  text-widget:
    id: "text-widget"
    name: "Text"
    description: "The text widget"
    icon: "Text"
    mandatory: false
    component: "TextWidget"
    path: "@Components/Text"
    max: 1000
    groups:
      - "journey-widgets"
      - "scene-widgets"
    configuration:
      default:
        text: "Enter text here"
        color: "#ffffff"
        shadow: false
        background:
          show: false
          color: transparent
          opacity: 0.15
          blur: false
        padding:
          top: 5
          right: 5
          bottom: 5
          left: 5
        opacity: 1
        size: 16
        fontFamily: "Roboto Condensed"
        lineHeight: 1.2
        orientation: 0
        textAlign: "center"
        weight: "normal"
        style: "normal"
        border:
          show: false
          color: "#ffffff"
          radius: none
          thickness: 1
          opacity: 1
          shadow: false
      user:
      elements:

  journey-stats-widget:
    id: "journey-stats-widget"
    name: "Stats"
    description: "Track data rendered as SVG"
    icon: "route"
    mandatory: false
    max: 1
    component: "JourneyStatsWidget"
    path: "@Components/Stats"

    groups:
      - "journey-widgets"
      - "scene-widgets"
    configuration:
      border:
        show: false
        color: "#ffffff"
        radius: none
        thickness: 1
        opacity: 1
        shadow: false
      user:
      elements: