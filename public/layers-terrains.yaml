########################################
# Layers and Terrains
########################################
## Current IDs
base: arcgis-normal                   # ID of the current base
base3d: null                          # ID of the current 3D base scene
tiles3d: null                         # ID of the current 3D tiles overlay
overlay: null                         # ID of the current overlay
terrain: reearth-world                # ID of the current terrain

colorSettings:                        # Layers color Settings

## Filter criteria
filter:
  byUsage: all
  byName: ''
  active: false
  thumbnail: true
  provider: true
  alphabetic: true
  byCountries: [ ]

## Providers List
providers:
  - id: reearth
    name: Re:Earth
    fullname: Re:Earth
    credits: 'Re:Earth Terrain - Mapterhorn - EGM2008'
    logo: 'https://avatars.githubusercontent.com/u/78837781?s=200&v=4'
    url: "https://terrain.reearth.land/"
    layers:
      ## WorldTerrain
      - name: World Terrain
        id: reearth-world
        image: reearth-world.png
        usage:
          type: free
          doc: 'https://github.com/reearth/reearth-terrain'

        type: terrain
        terrainType: 'url'
        url: 'https://terrain.reearth.land/cesium-mesh/ellipsoid'

      ## Buildings
      - name: Buildings
        id: reearth-buildings
        image: reearth-world.png
        usage:
          type: free
          doc: 'https://github.com/reearth/reearth-buildings'

        type: tiles3d
        show: true
        tiles3d:
          kind: url
          url: 'https://buildings.reearth.land/tileset.json'
          flyToOnLoad: false
          maximumScreenSpaceError: 16
          errorLabel: 'Re:Earth Buildings server error'
          errorLabelHeight: 120
          errorLabelPerTileMaxHeight: 5000

  ## Cesium
  - id: cesium
    name: Cesium
    fullname: Cesium
    credits: 'Esri, Vantor, Earthstar Geographics, and the GIS User Community'
    logo: ''
    url: 'https://cesium.com/platform/cesiumjs/'
    layers:
      ## WorldTerrain
      - name: World Terrain
        id: cesium-world
        assetId: 1
        image: cesium-world.png
        usage:
          type: freemium
          doc: ''

        type: terrain
        terrainType: 'cesium'

      ## Ellipsoid
      - name: Ellipsoid\(No Relief)
        id: cesium-ellipsoid
        image: cesium-ellipsoid.png
        usage:
          type: free
          doc: ''

        type: terrain
        terrainType: 'ellipsoid'
        noRelief: true

      ## Google Photorealistic 3D Tiles
      - name: Google Photo 3D
        id: google-photorealistic-3d
        image: cesium-world.png
        assetId: 2275207
        credits: 'Google Maps'
        logo: '/assets/images/layers/logos/google-maps.png'
        logoText: 'Google Maps'
        url: 'https://www.google.com/maps'
        usage:
          type: freemium
          doc: ''

        type: base3d
        sceneKind: google-photorealistic
        base3d:
          flyToOnLoad: false
          showGlobe: true
          showTerrain: false

      ## Azure Maps Aerial
      - name: Azure Maps Aerial
        id: azure-maps-aerial
        image: cesium-world.png
        assetId: 3891168
        usage:
          type: freemium
          doc: ''

        type: base
        tile: ion
        imageryKind: ion

      ## Google Maps 2D Photos
      - name: Google Maps 2D\Photos
        id: google-maps-2d-satellite
        image: cesium-world.png
        assetId: 3830182
        credits: 'Google Maps'
        logo: '/assets/images/layers/logos/google-maps.png'
        logoText: 'Google Maps'
        url: 'https://www.google.com/maps'
        usage:
          type: freemium
          doc: ''

        type: base
        tile: ion
        imageryKind: google2d
        mapType: satellite

      ## Google Maps 2D Satellite with Labels
      - name: Google Maps 2D\Photos + Labels
        id: google-maps-2d-satellite-labels
        image: cesium-world.png
        assetId: 3830183
        credits: 'Google Maps'
        logo: '/assets/images/layers/logos/google-maps.png'
        logoText: 'Google Maps'
        url: 'https://www.google.com/maps'
        usage:
          type: freemium
          doc: ''

        type: base
        tile: ion
        imageryKind: google2d
        mapType: satellite

      ## Azure Maps With Label
      - name: Azure Maps\Photos + Labels
        id: azure-maps-with-label
        image: cesium-world.png
        assetId: 3891168
        usage:
          type: freemium
          doc: ''

        type: overlay
        tile: ion
        imageryKind: ion

  ## IGN Provider (France)
  - id: ign                           # Provider ID
    name: IGN (France)                    # Provider name
    fullname: Institut national de l'information géographique et forestière
    credits: 'IGN (FR)'       # Credits added to logo
    # Logo
    logo: /assets/images/layers/logos/ign-simplifie.svg
    url: 'https://ign.fr'             # Provider Url

    ## Layers
