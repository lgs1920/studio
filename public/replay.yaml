replay:
  duration: 60
  poiDistance: 10000
  direction: 1
  loop: false
  scope: all-tracks
  hideOtherJourneys: false
  hideAllPoisDuringJourneyReplay: false
  animateAllPoisDuringJourneyReplay: false
  progression:
    fill:
      color: '#ff6a00'
      opacity: 1
      width: 2
      profileMarker: 8
    border:
      color: '#ffffff'
      opacity: 1
      width: 0.75
      profileMarker: 2
  profileInfo:
    color: '#ffffff'
    useTrackStyle: false
  trace:
    mode: progressive
    remaining:
      useDefinedTrackStyle: true
      color: '#6f7d8c'
      opacity: 0.35
  marker:
    mode: trace
    position: null
  camera:
    positionMode: system
    altitudeMode: constant
    altitude: 1200
    headingOffset: 0
    canDrift: true
    canFixHiddenMarker: true
    canRoll: true
    driftSensitivity: 1
    rollSensitivity: 1
    pitchCorrectionSensitivity: 1
    pitch: -65
    heading: 0
    hysteresis:
      marginRatio: 0.12
      easing: 0.18
  clips:
    catalog:
      zoom-in:
        id: zoom-in
        label: ZoomIn
        icon: magnifying-glass-plus
        slots: [ start ]
        maxInstances: 1
        description: Zoom from a camera point to the replay start.
        defaults:
          duration: 2
          altitude: 1200
          pitch: -65
        fields:
          - key: duration
            label: Duration (s)
            type: number
            min: 0
            max: 60
            step: 1
          - key: altitude
            label: Altitude
            type: number
            min: 10
            max: 100000
            step: 10
            unit: m
          - key: pitch
            label: Pitch
            type: number
            min: -89
            max: -5
            step: 1
            unit: deg
      zoom-out:
        id: zoom-out
        label: ZoomOut
        icon: magnifying-glass-minus
        slots: [ stop ]
        maxInstances: 1
        description: Zoom from the end of the journey to a camera point.
        defaults:
          duration: 2
          altitude: 1200
          pitch: -65
        fields:
          - key: duration
            label: Duration (s)
            type: number
            min: 0
            max: 60
            step: 1
          - key: altitude
            label: Altitude
            type: number
            min: 10
            max: 100000
            step: 10
            unit: m
          - key: pitch
            label: Pitch
            type: number
            min: -89
            max: -5
            step: 1
            unit: deg
      focus:
        id: focus
        label: Focus
        icon: crosshairs-simple
        slots: [ stop ]
        maxInstances: 1
        description: Focus on the journey centroid and keep the replay trace visible.
        defaults:
          duration: 3
          rpm: 3
          altitude: 1200
          pitch: -45
        fields:
          - key: duration
            label: Duration (s)
            type: number
            min: 0
            max: 60
            step: 1
          - key: rpm
            label: RPM
            type: number
            min: 0
            max: 30
            step: 0.5
          - key: altitude
            label: Altitude
            type: number
            min: 10
            max: 100000
            step: 10
            unit: m
          - key: pitch
            label: Pitch
            type: number
            min: -89
            max: -5
            step: 1
            unit: deg
      landing:
        id: landing
        label: Landing
        icon: plane-arrival
        slots: [ stop ]
        maxInstances: 1
        description: Lower the camera to the ground at the last point of the journey.
        defaults:
          duration: 2
        fields:
          - key: duration
            label: Duration (s)
            type: number
            min: 0
            max: 60
            step: 1
      take-off:
        id: take-off
        label: TakeOff
        icon: plane-departure
        slots: [ start ]
        maxInstances: 1
        description: Move the camera from the ground to the replay start point.
        defaults:
          duration: 2
          altitude: 300
          pitch: -35
        fields:
          - key: duration
            label: Duration (s)
            type: number
            min: 0
            max: 60
            step: 1
          - key: altitude
            label: Altitude
            type: number
            min: 10
            max: 100000
            step: 10
            unit: m
          - key: pitch
            label: Pitch
            type: number
            min: -89
            max: -5
            step: 1
            unit: deg
    start: [ ]
    stop: [ ]
