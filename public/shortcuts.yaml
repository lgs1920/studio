################################################################################
# LGS1920 Studio shortcut catalog
#
# Purpose:
#
# - User-facing reference for application shortcuts and pointer gestures.
# - Flat YAML list loaded by `src/core/events/appShortcuts.js`.
# - Documentation and runtime catalog for the same shortcut entries.
#
# Entry structure:
#
# 1. `action`
# 2. `description`
# 3. `id`
# 4. `keys`
# 5. `platform` when needed
# 6. `reference` when needed
# 7. `scope`
#
# Field rules:
#
# - `action`: Short English user-facing action name.
# - `description`: English explanation of the action and its active context.
# - `id`: Stable kebab-case identifier. Reuse it when updating an entry.
# - `scope`: Exact English interaction context used to group the catalog.
# - `platform`: Use values such as `macOS`, `Windows / Linux`, or
#   `macOS / Windows / Linux` when the binding differs by operating system.
# - `reference`: Set to `true` for gestures primarily documented as
#   interaction references or owned by a dedicated system. Omit it for
#   ordinary application shortcuts.
#
# Key rules:
#
# - `keys`: YAML list of alternative bindings.
# - Use `+` to join keys in one combination.
# - Use `Mod` for Meta on macOS or Ctrl on Windows/Linux.
# - Reuse the existing keyboard, mouse, touch, and wheel tokens.
#
# Maintenance rules:
#
# - Keep each `id` stable.
# - Keep the field order shown above.
# - Add new values only when the loader, shortcut manager, or owning
#   interaction system already supports them.
################################################################################

########################################
# Application commands
########################################

## Journey and profile

- action: Import journey
  description: Opens the journey import dialog.
  id: journey-import
  keys:
    - Alt+Shift+I
  scope: App
- action: Show journey toolbar
  description: Makes the journey toolbar available on the map.
  id: journey-toolbar-show
  keys:
    - Alt+Shift+J
  scope: App
- action: Hide other journeys
  description: Keeps only the current journey visible in the scenes.
  id: journey-hide-others-toggle
  keys:
    - Mod+Shift+J
  platform: macOS / Windows / Linux
  scope: App
- action: Open user profile settings
  description: Opens the user profile settings section.
  id: profile-settings-show
  keys:
    - Alt+Shift+U
  scope: App
- action: Show journey groups
  description: Opens the journey groups management drawer.
  id: journey-groups-show
  keys:
    - Alt+Shift+G
  scope: App

## Video

- action: Video recording
  description: Opens video setup, then starts recording when setup is already open.
  id: video-recording
  keys:
    - Alt+Shift+V
  scope: App

########################################
# Replay controls
########################################

## Replay management

- action: Show Replay controls
  description: Opens the Replay management drawer.
  id: replay-management-show
  keys:
    - Alt+Shift+W
  scope: Replay mode

## Timeline zoom and playback

- action: Zoom Replay timeline
  description: With the Replay timeline focused or selected, Shift+Wheel or Alt+Wheel changes the track row height from 24 to 64 pixels, Meta/Super+Wheel changes the ruler scale by 20% increments, ArrowUp and ArrowDown change the row height, and ArrowLeft and ArrowRight change the ruler scale. The ruler removes secondary ticks when zoomed out, shows 200 ms ticks at normal zoom, and shows 100 ms ticks at high zoom. Plain Wheel remains scrolling and Ctrl+Wheel remains the browser zoom; the minimum horizontal zoom adapts to the container width so the complete timeline can fit with a small right margin.
  id: replay-timeline-zoom
  keys:
    - Shift+Wheel
    - Meta+Wheel
    - ArrowUp
    - ArrowDown
    - ArrowLeft
    - ArrowRight
  platform: macOS / Windows / Linux
  scope: Replay timeline
- action: Play or pause Replay timeline
  description: Toggles local timeline playback with the focused Replay timeline. The shortcut changes only the timeline projection until a playback adapter is connected.
  id: replay-timeline-playback-keyboard
  keys:
    - Space
  scope: Replay timeline
- action: Go to Replay range boundary
  description: With the Replay timeline focused, Home moves the local playhead to the range start and End moves it to the range end.
  id: replay-timeline-boundary-keyboard
  keys:
    - Home
    - End
  scope: Replay timeline

## Timeline clip editing

- action: Remove focused Replay clip
  description: Removes the focused editable clip from the local timeline projection.
  id: replay-timeline-clip-remove-keyboard
  keys:
    - Delete
    - Backspace
  scope: Replay timeline
- action: Copy focused Replay clip
  description: Starts a copy-placement ghost for the focused editable clip; move it to the desired track and time, then click the primary pointer button to commit. Escape, a click outside the timeline, or a secondary-button/context-menu gesture cancels the placement.
  id: replay-timeline-clip-copy-keyboard
  keys:
    - Mod+C
  platform: macOS / Windows / Linux
  scope: Replay timeline
- action: Duplicate focused Replay clip
  description: Keeps the legacy duplicate shortcut and inserts the focused editable clip immediately after its current interval.
  id: replay-timeline-clip-duplicate-keyboard
  keys:
    - Mod+D
  platform: macOS / Windows / Linux
  scope: Replay timeline
- action: Enable or disable focused Replay clip
  description: Toggles the enabled state of the focused clip. Disabled clips remain visible for editing but do not participate in timeline playback when an execution adapter is connected.
  id: replay-timeline-clip-enabled-keyboard
  keys:
    - V
  scope: Replay timeline
- action: Mask or show focused Replay clip
  description: Toggles visibility of the focused clip in the Replay timeline.
  id: replay-timeline-clip-mask-keyboard
  keys:
    - M
  scope: Replay timeline
- action: Move Replay playhead
  description: Moves the focused Replay playhead by keyboardStepSeconds, or ten times that step with Shift. Alt+ArrowRight selects the range minimum and Alt+ArrowLeft selects the range maximum.
  id: replay-timeline-playhead-keyboard
  keys:
    - ArrowLeft
    - ArrowRight
    - Shift+ArrowLeft
    - Shift+ArrowRight
    - Alt+ArrowLeft
    - Alt+ArrowRight
  scope: Replay timeline

## Timeline navigation and range controls

- action: Set Replay position from the ruler
  description: In the ruler only, a click moves the live cursor, Alt+Click moves the range start when it does not pass the stop, and Ctrl+Click moves the range stop when it does not precede the start.
  id: replay-timeline-ruler-click
  keys:
    - Click
    - Alt+Click
    - Ctrl+Click
  scope: Replay timeline
- action: Jump inside the Replay timeline
  description: With the timeline focused, Shift+ArrowLeft moves the live cursor to the range start, Shift+ArrowRight moves it to the range stop, Shift+ArrowUp scrolls to the first track, and Shift+ArrowDown scrolls to the last track.
  id: replay-timeline-shift-navigation
  keys:
    - Shift+ArrowLeft
    - Shift+ArrowRight
    - Shift+ArrowUp
    - Shift+ArrowDown
  scope: Replay timeline
- action: Move Replay range boundary
  description: Moves the focused Replay range start or end boundary by keyboardStepSeconds, or ten times that step with Shift.
  id: replay-timeline-range-keyboard
  keys:
    - ArrowLeft
    - ArrowRight
    - Shift+ArrowLeft
    - Shift+ArrowRight
  scope: Replay timeline
- action: Resize Replay clip edge
  description: Resizes the focused Replay clip start or end edge by keyboardStepSeconds, or ten times that step with Shift.
  id: replay-timeline-clip-resize-keyboard
  keys:
    - ArrowLeft
    - ArrowRight
    - Shift+ArrowLeft
    - Shift+ArrowRight
  scope: Replay timeline
- action: Move Replay clip
  description: Moves the selected editable Replay clip by one rendered pixel with ArrowLeft or ArrowRight, or ten rendered pixels with Alt. Existing magnetic snapping takes priority over the requested pixel increment.
  id: replay-timeline-clip-move-keyboard
  keys:
    - ArrowLeft
    - ArrowRight
    - Alt+ArrowLeft
    - Alt+ArrowRight
  scope: Replay timeline
- action: Cancel Replay timeline gesture
  description: Cancels an active clip move, clip resize, track reorder, or range drag and restores the pre-gesture state.
  id: replay-timeline-cancel-gesture
  keys:
    - Escape
  scope: Replay timeline
- action: Adjust Replay clip snapping
  description: During a clip move or resize, Shift selects secondary ruler ticks and Alt temporarily disables snapping to ruler ticks, other clip edges, and the playhead.
  id: replay-timeline-clip-snapping
  keys:
    - Shift+Drag
    - Alt+Drag
  scope: Replay timeline
- action: Resize Replay track legend
  description: Resizes the focused Replay track legend with the native split-panel divider. Arrow keys move it, Shift changes the step, Home and End select the bounds, and Enter collapses or restores the panel.
  id: replay-timeline-split-keyboard
  keys:
    - ArrowLeft
    - ArrowRight
    - Shift+ArrowLeft
    - Shift+ArrowRight
    - Home
    - End
    - Enter
  scope: Replay timeline

########################################
# Replay camera preparation
########################################

## Camera adjustments

- action: Adjust replay camera heading
  description: Adjusts only the replay camera heading by 1 degree while replay camera preparation is active.
  id: replay-camera-heading-keyboard
  keys:
    - ArrowUp
    - ArrowDown
  scope: Replay camera setup
- action: Adjust replay camera angle
  description: Adjusts the Ahead/Behind replay camera angle by 1 degree while replay camera preparation is active.
  id: replay-camera-angle-keyboard
  keys:
    - ArrowLeft
    - ArrowRight
  scope: Replay camera setup

########################################
# Application and panel commands
########################################

## Mode and widget launch commands

- action: Manage widgets
  description: Opens the widget management drawer for the current board.
  id: widget-management-show
  keys:
    - Alt+W
  scope: App
- action: Toggle orbit
  description: Starts or stops map orbit around the current target.
  id: orbit-toggle
  keys:
    - Alt+Shift+O
  scope: App
- action: Toggle Orbit widget
  description: Shows or hides the Orbit widget while Orbit is running.
  id: orbit-widget-toggle
  keys:
    - Alt+O
  scope: Orbit mode
- action: Toggle panorama
  description: Starts or stops panorama mode around the current target.
  id: panorama-toggle
  keys:
    - Alt+Shift+P
  scope: App
- action: Toggle Panorama widget
  description: Shows or hides the Panorama widget while Panorama is active.
  id: panorama-widget-toggle
  keys:
    - Alt+P
  scope: Panorama mode

## Panel and drawer controls

- action: Close active panel
  description: Closes the active drawer, popup, or dialog when supported by the current view.
  id: app-close-active-panel
  keys:
    - Escape
  reference: true
  scope: App
- action: Resize focused drawer
  description: Adjusts the focused resizable drawer by 16 pixels with the horizontal arrow keys, or by 64 pixels with Shift plus an arrow key. Home selects the minimum width and End selects the configured maximum width.
  id: drawer-resize-keyboard
  keys:
    - ArrowLeft
    - ArrowRight
    - Shift+ArrowLeft
    - Shift+ArrowRight
    - Home
    - End
  reference: true
  scope: Resizable drawer
- action: Toggle drawer minimum or maximum width
  description: Double-clicks the resize handle to toggle the focused resizable drawer between its minimum initial width and its configured maximum width.
  id: drawer-resize-toggle
  keys:
    - Double click
  reference: true
  scope: Resizable drawer

########################################
# Selected widget commands
########################################

## Keyboard editing commands

- action: Edit selected widget
  description: Opens the editor for the selected widget.
  id: widget-edit
  keys:
    - Enter
  scope: Selected widget
- action: Remove selected widget
  description: Deletes the selected removable widget.
  id: widget-remove
  keys:
    - Delete
    - Backspace
  scope: Selected widget
- action: Resize selected widget
  description: Increases or decreases the selected widget size by 1%.
  id: widget-resize
  keys:
    - Plus
    - Minus
  scope: Selected widget
- action: Resize selected widget faster
  description: Increases or decreases the selected widget size by 10%.
  id: widget-resize-fast
  keys:
    - Ctrl+Plus
    - Ctrl+Minus
  scope: Selected widget
- action: Move selected widget
  description: Moves the selected widget by 2 px.
  id: widget-move
  keys:
    - ArrowUp
    - ArrowDown
    - ArrowLeft
    - ArrowRight
  scope: Selected widget
- action: Move selected widget faster
  description: Moves the selected widget by 20 px.
  id: widget-move-fast
  keys:
    - Ctrl+ArrowUp
    - Ctrl+ArrowDown
    - Ctrl+ArrowLeft
    - Ctrl+ArrowRight
  scope: Selected widget

########################################
# Widget interaction reference gestures
########################################

## Pointer and touch gestures

- action: Select widget
  description: Selects an interactive on-map widget.
  id: widget-select-pointer
  keys:
    - Left click
    - Tap
  reference: true
  scope: Widget interaction
- action: Move widget
  description: Drags a movable on-map widget.
  id: widget-move-pointer
  keys:
    - Left drag
  reference: true
  scope: Widget interaction
- action: Double-click widget
  description: Reduces or expands a reducible widget; opens the editor for visual widgets.
  id: widget-reduce-toggle
  keys:
    - Double click
    - Double tap
  reference: true
  scope: Widget interaction
- action: Snapshot widget
  description: Snapshot some widget content in png. Not all widgets support this.
  id: widget-snapshot
  keys:
    - Alt+Shift+S
  reference: true
  scope: Widget interaction
- action: Lock or unlock widget
  description: Locks or unlocks a lockable on-map widget in its current position.
  id: widget-lock-toggle
  keys:
    - Ctrl+Left click
  reference: true
  scope: Widget interaction
- action: Open widget menu
  description: Opens the context menu for an on-map widget, including reduced widgets.
  id: widget-context-menu
  keys:
    - Right click
    - Long tap
  reference: true
  scope: Widget interaction

