<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Replay camera zones</title>
  <desc id="desc">Nested Z1 and Z2 zones for navigation and dynamic mode.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc }
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #0f172a }
      .subtitle { font: 400 18px Inter, Arial, sans-serif; fill: #475569 }
      .label { font: 700 20px Inter, Arial, sans-serif; fill: #0f172a }
      .small { font: 500 15px Inter, Arial, sans-serif; fill: #334155 }
      .nav { fill: #eff6ff; stroke: #60a5fa; stroke-width: 3 }
      .dyn { fill: #fff7ed; stroke: #fb923c; stroke-width: 3 }
      .inner { fill: #ecfdf5; stroke: #34d399; stroke-width: 3 }
      .grid { stroke: #cbd5e1; stroke-width: 1.5; opacity: .55 }
      .frame { fill: #ffffff; stroke: #94a3b8; stroke-width: 3 }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="860" />
  <text class="title" x="80" y="78">Replay camera zones</text>
  <text class="subtitle" x="80" y="114">Navigation uses a single trigger zone. Dynamic mode uses nested Z1 and Z2.</text>

  <rect class="frame" x="100" y="170" width="1000" height="560" rx="28"/>
  <line class="grid" x1="600" y1="170" x2="600" y2="730"/>
  <line class="grid" x1="100" y1="450" x2="1100" y2="450"/>

  <rect class="nav" x="260" y="330" width="680" height="240" rx="26" opacity="0.45"/>
  <rect class="dyn" x="180" y="250" width="840" height="400" rx="26" opacity="0.35"/>
  <rect class="inner" x="420" y="340" width="360" height="220" rx="26"/>

  <text class="label" x="180" y="210">Dynamic Z1</text>
  <text class="small" x="180" y="236">Outer trigger zone, 75% × 75% default</text>

  <text class="label" x="180" y="620">Navigation Z1</text>
  <text class="small" x="180" y="646">Single trigger zone, 30% × 30% default</text>

  <text class="label" x="850" y="620">Dynamic Z2</text>
  <text class="small" x="850" y="646">Landing zone, 30% × 30% default</text>

  <circle cx="600" cy="450" r="16" fill="#0f172a"/>
  <text class="small" x="620" y="456">marker</text>
</svg>
