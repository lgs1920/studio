name: Continuous integration

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - COMMIT_HISTORY.md
  pull_request:
    paths-ignore:
      - COMMIT_HISTORY.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test and validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Configure private package registries
        env:
          FONTAWESOME_NPM_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN }}
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}
        run: |
          node <<'NODE'
          const {writeFileSync} = require('node:fs')
          const {env} = process

          if (!env.FONTAWESOME_NPM_TOKEN || !env.WEBAWESOME_NPM_TOKEN) {
              console.error('Missing FONTAWESOME_NPM_TOKEN or WEBAWESOME_NPM_TOKEN repository secret')
              process.exit(1)
          }

          const quote = value => JSON.stringify(value)
          const config = `[install.scopes]\n` +
              `"@fortawesome" = { token = ${quote(env.FONTAWESOME_NPM_TOKEN)}, url = "https://npm.fontawesome.com/" }\n` +
              `"@awesome.me" = { token = ${quote(env.FONTAWESOME_NPM_TOKEN)}, url = "https://npm.fontawesome.com/" }\n` +
              `"@web.awesome.me" = { token = ${quote(env.WEBAWESOME_NPM_TOKEN)}, url = "https://npm.cloudsmith.io/fortawesome/webawesome-pro/" }\n`

          writeFileSync(`${env.RUNNER_TEMP}/bunfig.toml`, config)
          NODE

      - name: Install dependencies
        run: bun --config "$RUNNER_TEMP/bunfig.toml" install --frozen-lockfile

      - name: Run the test projects
        run: bun run test

      - name: Run Oxlint
        run: bun run lint

      - name: Run TypeScript validation
        run: bun run typecheck

      - name: Build the application
        run: bun run build
