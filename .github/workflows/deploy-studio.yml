name: Deploy Studio

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - test
          - nightly
          - staging
      ref:
        description: Branch or commit to deploy
        required: true
        default: 1.0.0
        type: string
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: studio-deploy-${{ github.event_name == 'release' && 'production' || inputs.target }}
  cancel-in-progress: false

jobs:
  quality:
    name: Validate Studio
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the requested source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Configure private package registries
        env:
          FONTAWESOME_NPM_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN }}
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}
        run: |
          node <<'NODE'
          const {writeFileSync} = require('node:fs')
          const {env} = process

          if (!env.FONTAWESOME_NPM_TOKEN || !env.WEBAWESOME_NPM_TOKEN) {
              console.error('Missing FONTAWESOME_NPM_TOKEN or WEBAWESOME_NPM_TOKEN repository secret')
              process.exit(1)
          }

          const quote = value => JSON.stringify(value)
          const config = `[install.scopes]\n` +
              `"@fortawesome" = { token = ${quote(env.FONTAWESOME_NPM_TOKEN)}, url = "https://npm.fontawesome.com/" }\n` +
              `"@awesome.me" = { token = ${quote(env.FONTAWESOME_NPM_TOKEN)}, url = "https://npm.fontawesome.com/" }\n` +
              `"@web.awesome.me" = { token = ${quote(env.WEBAWESOME_NPM_TOKEN)}, url = "https://npm.cloudsmith.io/fortawesome/webawesome-pro/" }\n`

          writeFileSync(`${env.RUNNER_TEMP}/bunfig.toml`, config)
          NODE

      - name: Install dependencies
        run: bun install --config="$RUNNER_TEMP/bunfig.toml" --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Run Oxlint
        run: bun run lint -- --ignore-pattern artifacts/camera-hpr-sphere-preview/three.module.js

      - name: Run TypeScript validation
        run: bun run typecheck

      - name: Build Studio
        run: bun run build

  deploy:
    name: Deploy Studio to target
    needs: quality
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.event_name == 'release' && 'production' || inputs.target }}
      url: ${{ github.event_name == 'release' && 'https://studio.lgs1920.fr' || inputs.target == 'test' && 'https://test.lgs1920.fr' || inputs.target == 'nightly' && 'https://nightly.lgs1920.fr' || 'https://staging.lgs1920.fr' }}

    steps:
      - name: Check out the requested source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Configure private package registries
        env:
          FONTAWESOME_NPM_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN }}
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}
        run: |
          node <<'NODE'
          const {writeFileSync} = require('node:fs')
          const {env} = process

          if (!env.FONTAWESOME_NPM_TOKEN || !env.WEBAWESOME_NPM_TOKEN) {
              console.error('Missing FONTAWESOME_NPM_TOKEN or WEBAWESOME_NPM_TOKEN repository secret')
              process.exit(1)
          }

          const quote = value => JSON.stringify(value)
          const config = `[install.scopes]\n` +
              `"@fortawesome" = { token = ${quote(env.FONTAWESOME_NPM_TOKEN)}, url = "https://npm.fontawesome.com/" }\n` +
              `"@awesome.me" = { token = ${quote(env.FONTAWESOME_NPM_TOKEN)}, url = "https://npm.fontawesome.com/" }\n` +
              `"@web.awesome.me" = { token = ${quote(env.WEBAWESOME_NPM_TOKEN)}, url = "https://npm.cloudsmith.io/fortawesome/webawesome-pro/" }\n`

          writeFileSync(`${env.RUNNER_TEMP}/bunfig.toml`, config)
          NODE

      - name: Install dependencies
        run: bun install --config="$RUNNER_TEMP/bunfig.toml" --frozen-lockfile

      - name: Install deployment tools
        run: sudo apt-get update && sudo apt-get install --yes sshpass

      - name: Deploy the selected target
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PLATFORM: ${{ github.event_name == 'release' && 'production' || inputs.target }}
          DEPLOY_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOY_PASSWORD" ]; then
              echo "DEPLOY_PASSWORD is missing from the $DEPLOY_PLATFORM environment"
              exit 1
          fi

          export "LGS1920_PASSWORD_${DEPLOY_PLATFORM^^}=$DEPLOY_PASSWORD"
          export LGS1920_SOURCE_REF="$(git rev-parse HEAD)"
          export LGS1920_SOURCE_BRANCH="$DEPLOY_REF"

          if [ "$DEPLOY_PLATFORM" = 'production' ]; then
              if [ -z "$RELEASE_TAG" ]; then
                  echo 'Production deployments require a published pre-release tag'
                  exit 1
              fi
              export LGS_RELEASE_VERSION="${RELEASE_TAG#v}"
              bun run deploy -- --prod --ci
          elif [ "$DEPLOY_PLATFORM" = 'nightly' ]; then
              bun run deploy -- --nightly --ci
          elif [ "$DEPLOY_PLATFORM" = 'staging' ]; then
              bun run deploy -- --staging --ci
          elif [ "$DEPLOY_PLATFORM" = 'test' ]; then
              bun run deploy -- --test --ci
          else
              echo "Unsupported deployment target: $DEPLOY_PLATFORM"
              exit 1
          fi

      - name: Verify the deployed Studio URL
        env:
          DEPLOY_PLATFORM: ${{ github.event_name == 'release' && 'production' || inputs.target }}
        run: |
          set -euo pipefail

          if [ "$DEPLOY_PLATFORM" = 'production' ]; then
              url='https://studio.lgs1920.fr'
          elif [ "$DEPLOY_PLATFORM" = 'nightly' ]; then
              url='https://nightly.lgs1920.fr'
          elif [ "$DEPLOY_PLATFORM" = 'staging' ]; then
              url='https://staging.lgs1920.fr'
          elif [ "$DEPLOY_PLATFORM" = 'test' ]; then
              url='https://test.lgs1920.fr'
          else
              echo "Unsupported deployment target: $DEPLOY_PLATFORM"
              exit 1
          fi

          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --max-time 20 "$url/"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --max-time 20 "$url/version.json"
          echo "Studio is responding at $url"
