name: Nightly Studio deployment

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or commit to validate and deploy
        required: true
        default: 1.0.0
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-studio-nightly
  cancel-in-progress: false

jobs:
  quality:
    name: Validate nightly source
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the selected source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Configure private package registries
        env:
          FONTAWESOME_NPM_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN }}
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}
        run: |
          node <<'NODE'
          const {writeFileSync} = require('node:fs')
          const {env} = process

          if (!env.FONTAWESOME_NPM_TOKEN || !env.WEBAWESOME_NPM_TOKEN) {
              console.error('Missing FONTAWESOME_NPM_TOKEN or WEBAWESOME_NPM_TOKEN repository secret')
              process.exit(1)
          }

          const quote = value => JSON.stringify(value)
          const config = `[install.scopes]\n` +
              `"@fortawesome" = { token = ${quote(env.FONTAWESOME_NPM_TOKEN)}, url = "https://npm.fontawesome.com/" }\n` +
              `"@awesome.me" = { token = ${quote(env.FONTAWESOME_NPM_TOKEN)}, url = "https://npm.fontawesome.com/" }\n` +
              `"@web.awesome.me" = { token = ${quote(env.WEBAWESOME_NPM_TOKEN)}, url = "https://npm.cloudsmith.io/fortawesome/webawesome-pro/" }\n`

          writeFileSync(`${env.RUNNER_TEMP}/bunfig.toml`, config)
          NODE

      - name: Install dependencies
        run: bun install --config="$RUNNER_TEMP/bunfig.toml" --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Run Oxlint
        run: bun run lint

      - name: Run TypeScript validation
        run: bun run typecheck

      - name: Build the application
        run: bun run build

  deploy:
    name: Deploy nightly Studio
    needs: quality
    runs-on: ubuntu-latest
    environment: nightly
    timeout-minutes: 30

    steps:
      - name: Check out the selected source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Configure private package registries
        env:
          FONTAWESOME_NPM_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN }}
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}
        run: |
          node <<'NODE'
          const {writeFileSync} = require('node:fs')
          const {env} = process

          if (!env.FONTAWESOME_NPM_TOKEN || !env.WEBAWESOME_NPM_TOKEN) {
              console.error('Missing FONTAWESOME_NPM_TOKEN or WEBAWESOME_NPM_TOKEN repository secret')
              process.exit(1)
          }

          const quote = value => JSON.stringify(value)
          const config = `[install.scopes]\n` +
              `"@fortawesome" = { token = ${quote(env.FONTAWESOME_NPM_TOKEN)}, url = "https://npm.fontawesome.com/" }\n` +
              `"@awesome.me" = { token = ${quote(env.FONTAWESOME_NPM_TOKEN)}, url = "https://npm.fontawesome.com/" }\n` +
              `"@web.awesome.me" = { token = ${quote(env.WEBAWESOME_NPM_TOKEN)}, url = "https://npm.cloudsmith.io/fortawesome/webawesome-pro/" }\n`

          writeFileSync(`${env.RUNNER_TEMP}/bunfig.toml`, config)
          NODE

      - name: Install dependencies
        run: bun install --config="$RUNNER_TEMP/bunfig.toml" --frozen-lockfile

      - name: Install SCP password helper
        run: sudo apt-get update && sudo apt-get install --yes sshpass

      - name: Deploy nightly Studio
        env:
          LGS1920_PASSWORD_NIGHTLY: ${{ secrets.DEPLOY_PASSWORD }}
        run: bun run deploy -- --nightly --ci
